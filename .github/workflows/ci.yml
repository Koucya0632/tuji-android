name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Pinned, not "latest". The iOS side spent a red CI on somebody else's PR
      # learning that an unpinned tool version turns an upstream release into a
      # failure nobody's change caused.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build reads these from the environment when secrets.properties is
      # absent, which it always is here — see app/build.gradle.kts `secret()`.
      - name: Build and test
        env:
          TUJI_BASE_URL: ${{ secrets.TUJI_BASE_URL }}
          TUJI_SUPABASE_URL: ${{ secrets.TUJI_SUPABASE_URL }}
          TUJI_SUPABASE_ANON_KEY: ${{ secrets.TUJI_SUPABASE_ANON_KEY }}
          TUJI_GOOGLE_WEB_CLIENT_ID: ${{ secrets.TUJI_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew --no-daemon build

      # A missing translation is not a compile error, so without this step
      # nothing in the pipeline would ever notice one.
      - name: Check localisation
        run: python3 scripts/check-localization.py

      # A green tick is not the same as tests having run. The iOS project has
      # been bitten by a crashed suite that still printed ✔ with a smaller test
      # count, so the count is asserted rather than assumed.
      - name: Assert tests actually ran
        if: always()
        run: ./scripts/check-test-counts.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
